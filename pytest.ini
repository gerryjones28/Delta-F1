[pytest]
testpaths = tests
pythonpath = .
; --basetemp keeps pytest scratch directories inside the project. On this
; machine the default %TEMP%\pytest-of-<user> directory is not readable, which
; makes every test that uses tmp_path error out. Remove it if your temp
; directory works normally.
addopts = -ra --basetemp=.pytest_tmp
markers =
    integration: needs network access (OpenF1) or a local F1DB CSV directory
